name: Apply ISP 2026 semantic workbook repair

on:
  push:
    branches:
      - agent/isp2026-workbook-table-notebooks
    paths:
      - .github/workflows/apply-isp2026-semantic-repair.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/isp2026-workbook-table-notebooks
          fetch-depth: 0

      - name: Apply verified semantic repair
        shell: bash
        run: |
          set -euo pipefail
          cat \
            scripts/.isp2026-repair-final/part00 \
            scripts/.isp2026-repair-final/part01 \
            scripts/.isp2026-repair-final/tail \
            | base64 -d > /tmp/isp2026-repair.diff.gz
          printf '%s  %s\n' \
            '3e7020bf46ba1e0e89f22e252a503efa218b5b778592ceae15e9e7659e192a3f' \
            '/tmp/isp2026-repair.diff.gz' | sha256sum -c -
          gzip -dc /tmp/isp2026-repair.diff.gz \
            | grep -v '^Binary files ' > /tmp/isp2026-repair.diff
          printf '%s  %s\n' \
            '2e74f330502159029e59262106526ccb7a6931cbae50f0a2e37f41f172f74f80' \
            '/tmp/isp2026-repair.diff' | sha256sum -c -
          patch -p1 --batch --forward < /tmp/isp2026-repair.diff

          cp scripts/eda_isp2026_inputs_workbook_tables.py /tmp/eda.expected.py
          cp scripts/parse_isp2026_inputs_workbook_tables.py /tmp/parse.expected.py
          python scripts/isp2026_workbook/assemble.py
          cmp /tmp/eda.expected.py scripts/eda_isp2026_inputs_workbook_tables.py
          cmp /tmp/parse.expected.py scripts/parse_isp2026_inputs_workbook_tables.py
          python -m py_compile \
            scripts/eda_isp2026_inputs_workbook_tables.py \
            scripts/parse_isp2026_inputs_workbook_tables.py \
            scripts/isp2026_workbook/assemble.py
          test "$(find scripts/isp2026_workbook/discovery -maxdepth 1 -name '[0-9][0-9][0-9]_*.py' | wc -l)" -eq 84
          test "$(find scripts/isp2026_workbook/parsing -maxdepth 1 -name '[0-9][0-9][0-9]_*.py' | wc -l)" -eq 84
          test "$(grep -c '^# ### ' scripts/eda_isp2026_inputs_workbook_tables.py)" -eq 243
          test "$(grep -c '^# ### ' scripts/parse_isp2026_inputs_workbook_tables.py)" -eq 243

      - name: Commit and push repaired worksheet batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/isp2026_workbook/discovery/_setup.py \
            scripts/isp2026_workbook/discovery/_footer.py \
            scripts/isp2026_workbook/parsing/_setup.py \
            scripts/isp2026_workbook/parsing/_footer.py
          if ! git diff --cached --quiet; then
            git commit -m "Repair ISP 2026 workbook semantic parsing"
            git push origin HEAD:agent/isp2026-workbook-table-notebooks
          fi

          for start in 1 13 25 37 49 61 73; do
            end=$((start + 11))
            for n in $(seq "$start" "$end"); do
              prefix=$(printf '%03d' "$n")
              git add scripts/isp2026_workbook/discovery/${prefix}_*.py
              git add scripts/isp2026_workbook/parsing/${prefix}_*.py
            done
            if ! git diff --cached --quiet; then
              git commit -m "Repair ISP 2026 workbook sheets $(printf '%02d' "$start")-$(printf '%02d' "$end")"
              git push origin HEAD:agent/isp2026-workbook-table-notebooks
            fi
          done

          git add \
            scripts/eda_isp2026_inputs_workbook_tables.py \
            scripts/parse_isp2026_inputs_workbook_tables.py \
            scripts/isp2026_workbook/assemble.py
          if ! git diff --cached --quiet; then
            git commit -m "Assemble repaired ISP 2026 workbook notebooks"
            git push origin HEAD:agent/isp2026-workbook-table-notebooks
          fi

      - name: Remove repair transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            scripts/.isp2026-repair-final \
            scripts/.isp2026-repair-payload \
            .github/workflows/apply-isp2026-semantic-repair.yml
          git add -A \
            scripts/.isp2026-repair-final \
            scripts/.isp2026-repair-payload \
            .github/workflows/apply-isp2026-semantic-repair.yml
          git commit -m "Remove ISP 2026 repair transport files"
          git push origin HEAD:agent/isp2026-workbook-table-notebooks
