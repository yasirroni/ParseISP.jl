name: Refactor ISP 2026 workbook notebooks into per-sheet sources

on:
  push:
    branches:
      - agent/isp2026-workbook-table-notebooks
    paths:
      - .github/workflows/refactor-isp2026-workbook-split.yml

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/isp2026-workbook-table-notebooks
          fetch-depth: 0

      - name: Split existing Jupytext sources without changing content
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import hashlib
          import re
          from pathlib import Path

          scripts = Path('scripts')
          out = scripts / 'isp2026_workbook'
          sources = {
              'discovery': scripts / 'eda_isp2026_inputs_workbook_tables.py',
              'parsing': scripts / 'parse_isp2026_inputs_workbook_tables.py',
          }
          footer_headings = {'discovery': 'Coverage check', 'parsing': 'Validation'}

          def sheet_names(source: Path) -> list[str]:
              module = ast.parse(source.read_text())
              for node in module.body:
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id == 'SHEET_RANGES':
                              return list(ast.literal_eval(node.value))
              raise RuntimeError(f'SHEET_RANGES not found in {source}')

          def slugify(name: str) -> str:
              return re.sub(r'[^a-z0-9]+', '_', name.strip().lower()).strip('_')

          def marker(heading: str) -> str:
              return f'# %% [markdown]\n# ## {heading}\n'

          def split_source(kind: str, source: Path) -> None:
              text = source.read_text()
              names = sheet_names(source)
              assert len(names) == 84, (kind, len(names))
              target = out / kind
              target.mkdir(parents=True, exist_ok=True)

              first = text.index(marker(names[0].strip()))
              footer = text.index(marker(footer_headings[kind]))
              (target / '_setup.py').write_text(text[:first])
              (target / '_footer.py').write_text(text[footer:])

              starts = []
              for index, name in enumerate(names, 1):
                  pos = text.index(marker(name.strip()), first, footer)
                  starts.append((index, name, pos))
              assert len({pos for _, _, pos in starts}) == 84

              for i, (index, name, start) in enumerate(starts):
                  end = starts[i + 1][2] if i + 1 < len(starts) else footer
                  (target / f'{index:03d}_{slugify(name)}.py').write_text(text[start:end])

              parts = [(target / '_setup.py').read_text()]
              parts.extend(path.read_text() for path in sorted(target.glob('[0-9][0-9][0-9]_*.py')))
              parts.append((target / '_footer.py').read_text())
              rebuilt = ''.join(parts)
              assert rebuilt == text, f'{kind} split failed byte-for-byte round trip'
              print(kind, hashlib.sha256(rebuilt.encode()).hexdigest())

          for kind, source in sources.items():
              split_source(kind, source)

          (out / 'assemble.py').write_text('''from __future__ import annotations\n\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent\nSCRIPTS = ROOT.parent\n\nTARGETS = {\n    "discovery": SCRIPTS / "eda_isp2026_inputs_workbook_tables.py",\n    "parsing": SCRIPTS / "parse_isp2026_inputs_workbook_tables.py",\n}\n\n\ndef assemble(kind: str) -> str:\n    source_dir = ROOT / kind\n    parts = [(source_dir / "_setup.py").read_text()]\n    parts.extend(path.read_text() for path in sorted(source_dir.glob("[0-9][0-9][0-9]_*.py")))\n    parts.append((source_dir / "_footer.py").read_text())\n    return "".join(parts)\n\n\ndef write_notebooks() -> None:\n    for kind, target in TARGETS.items():\n        target.write_text(assemble(kind))\n\n\nif __name__ == "__main__":\n    write_notebooks()\n''')
          PY

          test "$(find scripts/isp2026_workbook/discovery -maxdepth 1 -name '[0-9][0-9][0-9]_*.py' | wc -l)" -eq 84
          test "$(find scripts/isp2026_workbook/parsing -maxdepth 1 -name '[0-9][0-9][0-9]_*.py' | wc -l)" -eq 84
          python -m compileall -q scripts/isp2026_workbook

          cp scripts/eda_isp2026_inputs_workbook_tables.py /tmp/eda-before.py
          cp scripts/parse_isp2026_inputs_workbook_tables.py /tmp/parse-before.py
          python scripts/isp2026_workbook/assemble.py
          cmp /tmp/eda-before.py scripts/eda_isp2026_inputs_workbook_tables.py
          cmp /tmp/parse-before.py scripts/parse_isp2026_inputs_workbook_tables.py

      - name: Commit and push split sources in worksheet batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/isp2026_workbook/assemble.py \
            scripts/isp2026_workbook/discovery/_setup.py \
            scripts/isp2026_workbook/discovery/_footer.py \
            scripts/isp2026_workbook/parsing/_setup.py \
            scripts/isp2026_workbook/parsing/_footer.py
          git commit -m "Split ISP 2026 notebook shared setup"
          git push origin HEAD:agent/isp2026-workbook-table-notebooks

          for start in 1 13 25 37 49 61 73; do
            end=$((start + 11))
            for n in $(seq "$start" "$end"); do
              prefix=$(printf '%03d' "$n")
              git add scripts/isp2026_workbook/discovery/${prefix}_*.py
              git add scripts/isp2026_workbook/parsing/${prefix}_*.py
            done
            git commit -m "Split ISP 2026 workbook sheets $(printf '%02d' "$start")-$(printf '%02d' "$end")"
            git push origin HEAD:agent/isp2026-workbook-table-notebooks
          done

          test -z "$(git status --porcelain -- scripts/eda_isp2026_inputs_workbook_tables.py scripts/parse_isp2026_inputs_workbook_tables.py)"
          test "$(find scripts/isp2026_workbook/discovery -maxdepth 1 -name '[0-9][0-9][0-9]_*.py' | wc -l)" -eq 84
          test "$(find scripts/isp2026_workbook/parsing -maxdepth 1 -name '[0-9][0-9][0-9]_*.py' | wc -l)" -eq 84

          rm .github/workflows/refactor-isp2026-workbook-split.yml
          git add -u .github/workflows/refactor-isp2026-workbook-split.yml
          git commit -m "Remove ISP 2026 split refactor workflow"
          git push origin HEAD:agent/isp2026-workbook-table-notebooks
