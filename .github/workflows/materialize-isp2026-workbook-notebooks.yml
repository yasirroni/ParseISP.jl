name: Materialize ISP 2026 workbook notebooks

on:
  push:
    branches:
      - agent/isp2026-workbook-table-notebooks
    paths:
      - .github/workflows/materialize-isp2026-workbook-notebooks.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/isp2026-workbook-table-notebooks

      - name: Materialize notebook sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          payload = Path("scripts/.isp2026_payload")
          outputs = {
              "eda_isp2026_inputs_workbook_tables.py": "754113f95385456ecb96d783683a1fb76be720e9ec6311b2401c320269bddfae",
              "parse_isp2026_inputs_workbook_tables.py": "87238904b5868d2e9cc638994d2f087e65b136dda31ce2b879adb1c6bd5e41c7",
          }

          for filename, expected_sha256 in outputs.items():
              parts = sorted(payload.glob(filename + ".part*"))
              if not parts:
                  raise SystemExit(f"No payload parts found for {filename}")
              encoded = "".join(part.read_text().strip() for part in parts)
              data = gzip.decompress(base64.b64decode(encoded))
              actual_sha256 = hashlib.sha256(data).hexdigest()
              if actual_sha256 != expected_sha256:
                  raise SystemExit(
                      f"{filename}: SHA-256 {actual_sha256} != {expected_sha256}"
                  )
              (Path("scripts") / filename).write_bytes(data)
          PY

          python -m py_compile \
            scripts/eda_isp2026_inputs_workbook_tables.py \
            scripts/parse_isp2026_inputs_workbook_tables.py

          rm -rf scripts/.isp2026_payload scripts/isp2026_workbook_checkpoints

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add ISP 2026 workbook parsing notebooks"
          git push origin HEAD:agent/isp2026-workbook-table-notebooks
